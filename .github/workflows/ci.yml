name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── TS 主工程：测试 + 类型检查（跨平台矩阵） ───
  node-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      # derive_split 等测试含真实 Go 编译/测试验收闭环，macOS runner 默认无 go in PATH，
      # 显式安装保证 Go 场景在所有平台都被真正执行（而非 skipIf 降级跳过）
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: 安装依赖
        run: npm ci
      # 质量闸门（防 skip hook / 纯本地校验漏网）：build 后跑，因契约闸门需 dist 的 ts_kernel
      - name: 类型检查 + 构建（tsc + gen bundle）
        run: npm run build
      - name: STALE BUILD 自检（build 后应无 stale；有则说明产物与源码不一致）
        run: node --input-type=module -e "import('./dist/src/tools/stale_check.js').then(async m=>{const r=m.checkStaleBuild(process.cwd());console.log('scanned '+r.scanned+' stale '+r.stale);if(r.stale){console.log(m.formatStaleText(r));process.exit(1)}})"
      - name: 契约变更闸门（新增/改名残留未同步文档 → 阻断）
        run: node scripts/contract_docs_gate.mjs
      - name: README 工具数自检（共注册 N 个 == server_registry 真实数）
        run: node scripts/readme_tools_gate.mjs --check
      - name: 能力矩阵漂移闸门（实现触达语言但声明漏登记 → 阻断）
        run: node scripts/capability_scan.mjs --check
      - name: 单元测试（vitest）
        run: npm test

  # ─── Go 插桩组件：go-observe / go-slim ───
  go-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [go-observe, go-slim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: 编译
        run: go build ./...
        working-directory: ${{ matrix.module }}
      - name: Go 测试
        run: go test ./...
        working-directory: ${{ matrix.module }}
